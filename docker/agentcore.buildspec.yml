version: 0.2
# CodeBuild buildspec for the FactoryMind AgentCore Runtime image.
#
# Runs in an ARM64 standard image, builds the Dockerfile, pushes the
# resulting image to ECR. Used by scripts/deploy_agentcore.py to avoid
# requiring local Docker.

env:
  variables:
    IMAGE_TAG: "latest"
    DOCKERFILE: "docker/agentcore.Dockerfile"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR (${AWS_REGION})"
      - aws --version
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - REPO_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
      - echo "Repo URI = $REPO_URI"

  build:
    commands:
      - echo "Building AgentCore image (arm64)"
      - docker build --platform linux/arm64 -f $DOCKERFILE -t "$REPO_URI:$IMAGE_TAG" .

  post_build:
    commands:
      - echo "Pushing image to ECR"
      - docker push "$REPO_URI:$IMAGE_TAG"
      - echo "$REPO_URI:$IMAGE_TAG" > image-uri.txt
      - cat image-uri.txt

artifacts:
  files:
    - image-uri.txt
